<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Le Calendrier de l'Avent de Pixel</title>
  <meta name="description" content="24 énigmes pour apprendre à coder, déchiffrer et enquêter avant Noël." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>

  <header class="hero">
    <div class="hero-emoji">🧝‍♂️</div>
    <h1>Le Calendrier de l'Avent <span>de Pixel</span></h1>
    <p class="lead">🚨 Un pirate a piraté le serveur du Père Noël&nbsp;! Chaque jour, une énigme pour mener l'enquête, réparer les systèmes et sauver Noël.</p>
    <p id="countdown" class="countdown"></p>
    <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
    <p id="progress-text" class="progress-text"></p>
  </header>

  <main>
    <div id="grid" class="grid"></div>
  </main>

  <footer>
    <p>Une énigme par jour, à faire à deux. Pas besoin de tout savoir : les indices sont là pour ça 😉</p>
    <button id="reset" class="link" type="button">Recommencer à zéro</button>
  </footer>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button id="modal-close" class="modal-close" type="button" aria-label="Fermer">✕</button>
      <div id="modal-scroll" class="modal-scroll"><div id="modal-body"></div></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>

  <script src="js/sha256.js"></script>
  <script src="js/days.js"></script>
  <script src="js/pyrunner.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
